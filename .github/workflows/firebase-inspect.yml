name: Inspect Firebase setup
on:
  push:
    paths:
      - '.github/workflows/firebase-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Inspect Firestore database edition
        run: npx -y firebase-tools@latest firestore:databases:list --project nickel-64 --json --non-interactive
      - name: Inspect default database
        run: npx -y firebase-tools@latest firestore:databases:get '(default)' --project nickel-64 --json --non-interactive
